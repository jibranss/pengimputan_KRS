<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIAKAD UNIDA - Portal Dosen</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/all.min.css">
    <style>
        :root { --unida-blue: #003366; --unida-gold: #b8860b; }
        body { background-color: #f8f9fa; font-family: 'Segoe UI', sans-serif; overflow-x: hidden; }
        .navbar { background-color: var(--unida-blue) !important; border-bottom: 4px solid var(--unida-gold); }
        .sidebar { background: white; min-height: 100vh; border-right: 1px solid #dee2e6; padding-top: 20px; }
        .profile-dosen { background: var(--unida-blue); color: white; padding: 20px; text-align: center; border-radius: 0 0 20px 20px; margin-bottom: 20px; }
        .nav-link { color: #495057; font-weight: 500; padding: 12px 20px; }
        .nav-link.active { background: var(--unida-blue); color: white !important; border-radius: 5px; margin: 0 10px; }
        .card-header { background-color: var(--unida-blue); color: white; font-weight: bold; }
        .stat-card { border-left: 5px solid var(--unida-gold); border-radius: 10px; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark sticky-top shadow">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="#">PORTAL <span style="color: var(--unida-gold);">DOSEN</span></a>
            <div class="text-white">
                <span class="me-3">Selamat Datang, <strong id="nama-dosen">Jibran</strong></span>
                <button onclick="logout()" class="btn btn-danger btn-sm">Keluar</button>
            </div>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-2 d-none d-md-block sidebar p-0">
                <div class="profile-dosen mx-2">
                    <div class="bg-warning rounded-circle d-inline-block p-3 mb-2 fw-bold text-dark" style="width: 60px; height: 60px;">DU</div>
                    <h6 id="sidebar-nama-dosen">Jibran</h6>
                    <small class="text-warning">NIDN: 452024611009</small>
                </div>
                <ul class="nav flex-column">
                    <li class="nav-item"><a class="nav-link active" href="#"><i class="fa fa-tachometer-alt me-2"></i> KRS Mahasiswa</a></li>
                  
                </ul>
            </nav>

            <main class="col-md-10 px-md-4 py-4">
                <div class="row mb-4">
                    <div class="col-md-4">
                        <div class="card stat-card shadow-sm p-3 mb-2">
                            <small class="text-muted text-uppercase">ditolak</small>
                            <div class="h3 fw-bold">1</div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card stat-card shadow-sm p-3 mb-2" style="border-left-color: #28a745;">
                            <small class="text-muted text-uppercase">KRS Disetujui</small>
                            <div class="h3 fw-bold text-success">1</div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card stat-card shadow-sm p-3 mb-2" style="border-left-color: #dc3545;">
                            <small class="text-muted text-uppercase">Menunggu Persetujuan</small>
                            <div class="h3 fw-bold text-danger">0</div>
                        </div>
                    </div>
                </div>

                <div class="card shadow-sm border-0">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <span>Daftar Pengajuan KRS Mahasiswa</span>
                        <button class="btn btn-light btn-sm" onclick="loadDosen()">Perbarui Data</button>
                    </div>
                    <div class="card-body p-0">
                        <table class="table table-hover mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th class="ps-3">Nama Mahasiswa</th>
                                    <th>Mata Kuliah</th>
                                    <th>Status Saat Ini</th>
                                    <th class="text-center">Tindakan</th>
                                </tr>
                            </thead>
                            <tbody id="tabelDosen">
                                </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        const user = JSON.parse(localStorage.getItem('user'));
        if(user && user.role === 'dosen') {
            document.getElementById('nama-dosen').innerText = user.nama;
            document.getElementById('sidebar-nama-dosen').innerText = user.nama;
            loadDosen();
        } else { window.location.href = 'login.html'; }
        
        function logout() { localStorage.clear(); window.location.href = 'login.html'; }
    </script>
</body>
</html>

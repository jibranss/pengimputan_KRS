<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIAKAD UNIDA - Mahasiswa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/all.min.css">
    <style>
        :root { --unida-blue: #003366; --unida-gold: #b8860b; }
        body { background-color: #f4f7f6; font-family: 'Segoe UI', sans-serif; }
        .navbar { background-color: var(--unida-blue) !important; border-bottom: 4px solid var(--unida-gold); }
        .sidebar { background: white; min-height: 100vh; border-right: 1px solid #ddd; }
        .profile-section { background: var(--unida-blue); color: white; padding: 20px; text-align: center; }
        .nav-link { color: #333; }
        .nav-link.active { background-color: #e9ecef; color: var(--unida-blue); font-weight: bold; }
        .card-header { background-color: var(--unida-blue); color: white; font-weight: bold; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="#">SIAKAD <span style="color: var(--unida-gold);">UNIDA</span></a>
            <button onclick="logout()" class="btn btn-sm btn-danger"><i class="fa fa-power-off"></i> Logout</button>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-2 d-none d-md-block sidebar p-0">
                <div class="profile-section">
                    <img src="https://ui-avatars.com/api/?name=Mahasiswa+Unida&background=b8860b&color=fff" class="rounded-circle mb-2" width="60">
                    <h6 id="sidebar-nama" class="mb-0">Memuat...</h6>
                    <small id="sidebar-nim" class="text-warning"></small>
                </div>
                <ul class="nav flex-column mt-3">
                    <li class="nav-item">
                        <a class="nav-link active" href="#"><i class="fa fa-home me-2"></i> KRS</a>
                    </li>
                   
            </nav>

            <main class="col-md-10 px-md-4 py-4">
                <div class="d-flex justify-content-between align-items-center border-bottom pb-2 mb-4">
                    <h4 class="fw-bold text-dark">Portal Akademik Mahasiswa</h4>
                </div>

                <div class="card shadow-sm border-0">
                    <div class="card-header d-flex justify-content-between align-items-center border-0 py-3">
                        <h5 class="mb-0"><i class="fa fa-list-alt me-2"></i> Jadwal KRS Saya</h5>
                        <button class="btn btn-light btn-sm fw-bold text-primary shadow-sm" data-bs-toggle="modal" data-bs-target="#modalTambah">
                            <i class="fa fa-plus-circle"></i> Tambah Matkul
                        </button>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-striped table-hover mb-0 align-middle">
                                <thead class="table-light">
                                    <tr>
                                        <th class="ps-3">Mata Kuliah</th>
                                        <th>SKS</th>
                                        <th>Jadwal</th>
                                        <th class="text-center">Status</th>
                                    </tr>
                                </thead>
                                <tbody id="tabelKRS">
                                    </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <div class="modal fade" id="modalTambah" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title">Pilih Mata Kuliah</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Daftar Mata Kuliah</label>
                        <select id="selectMatkul" class="form-select">
                            <option value="Pemrograman Web">Pemrograman Web (3 SKS)</option>
                            <option value="Basis Data">Basis Data (3 SKS)</option>
                            <option value="Jaringan Komputer">Jaringan Komputer (3 SKS)</option>
                            <option value="Metode Numerik">Metode Numerik (3 SKS)</option>
                            <option value="Pemodelan optimasi">Pemodelan optimasi (2 SKS)</option>
                            <option value="Kalkulus">Kalkulus (3 SKS)</option>
                            <option value="Statistika ">Statistika  (3 SKS)</option>
                            
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Jadwal Default</label>
                        <input type="text" id="jadwalMatkul" class="form-control" value="Senin, 08:00 - 10:30" readonly>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
                    <button type="button" onclick="tambahKRS()" class="btn btn-primary px-4">Simpan ke KRS</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Logika Inisialisasi Halaman
        const user = JSON.parse(localStorage.getItem('user'));
        if(user && user.role === 'mahasiswa') {
            document.getElementById('sidebar-nama').innerText = user.nama;
            document.getElementById('sidebar-nim').innerText = "NIM: " + user.username;
            loadKRSMahasiswa(); // Memanggil fungsi di script.js
        } else {
            // Jika tidak ada data user atau role bukan mahasiswa, tendang ke login
            window.location.href = 'login.html'; 
        }
        
        function logout() {
            localStorage.clear();
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
